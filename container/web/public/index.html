<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nf-price-tracker — notas fiscais</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <h1>nf-price-tracker</h1>
    <p class="sub">Notas fiscais escaneadas</p>
  </header>

  <main>
    <section class="panel scan">
      <h2>Testar o fluxo</h2>
      <p class="hint">
        Cole a URL do QR code de uma NFC-e — ou apenas a chave de acesso, como
        aparece impressa: <code>4126 0906 0572 …</code>
      </p>
      <form id="scan-form" autocomplete="off">
        <input
          id="scan-url"
          type="text"
          name="nota"
          inputmode="text"
          placeholder="URL do QR code, ou a chave de acesso (44 dígitos)"
          required
          spellcheck="false"
          autocapitalize="off">
        <button type="submit" id="scan-button">Escanear nota</button>
        <button type="button" id="sample-button" class="ghost" hidden
                title="Preencher com a nota de exemplo (defina NFCE_SAMPLE_URL)">
          Exemplo
        </button>
      </form>
      <output id="scan-status" class="status" role="status" aria-live="polite"></output>
    </section>

    <div id="view"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
