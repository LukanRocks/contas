# Each app lives in its own top-level folder (backend, and future siblings).
packages:
  - "*"
  # The mobile app is the exception: it manages its own dependencies in
  # app/pnpm-lock.yaml. The Docker image installs this workspace with --prod,
  # and the React Native toolchain has no place in a server image -- nor does
  # every backend `pnpm install` need to fetch it. See app/README.md.
  - "!app"

# better-sqlite3 ships a native binding; without this pnpm silently skips its
# build script and importing it fails at runtime.
onlyBuiltDependencies:
  - better-sqlite3
