name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Pure helpers only (formatting, URL normalization, QR classification);
      # building the native app is EAS's job, not this workflow's.
      - run: pnpm test
